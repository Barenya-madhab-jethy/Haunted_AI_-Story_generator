<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - Haunted Realm</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #000000, #1a0000, #0d001a, #000000);
            background-attachment: fixed;
            color: #ff0000;
            font-family: 'Creepster', cursive;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            text-align: center;
            overflow-x: hidden;
            position: relative;
            animation: heartbeat 2s infinite;
            filter: sepia(0.1) contrast(1.2) brightness(0.8);
            transition: background 1s ease, filter 1s ease;
        }
        
        body.dark-mode {
            background: linear-gradient(135deg, #000000, #000033, #000000, #000000);
            filter: sepia(0.2) contrast(1.5) brightness(0.5) hue-rotate(180deg);
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(255, 0, 0, 0.1) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(128, 0, 128, 0.1) 0%, transparent 50%), radial-gradient(circle at 40% 80%, rgba(0, 0, 0, 0.8) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
            animation: shadow-shift 10s infinite linear;
        }
        
        h1 {
            font-size: 3em;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 30px #ff0000, 0 0 40px #ff0000;
            animation: flicker 2s infinite alternate, blood-drip 4s infinite;
            margin-top: 50px;
        }
        
        .feedback-form {
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #ff0000;
            border-radius: 10px;
            padding: 30px;
            margin: 30px auto;
            max-width: 600px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5), inset 0 0 10px rgba(139, 0, 0, 0.3);
            animation: pulse 3s infinite;
        }
        
        .rating {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
        
        .star {
            font-size: 2em;
            color: #666;
            cursor: pointer;
            margin: 0 5px;
            transition: color 0.3s;
        }
        
        .star:hover,
        .star.active {
            color: #ff0000;
        }
        
        textarea {
            width: 80%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ff0000;
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.8);
            color: #ffffff;
            font-family: 'Creepster', cursive;
            font-size: 1.2em;
            text-align: center;
            resize: vertical;
        }
        
        textarea:focus {
            outline: none;
            box-shadow: 0 0 10px #ff0000;
        }
        
        button {
            background: #8b0000;
            color: #ff0000;
            border: 2px solid #ff0000;
            padding: 12px 20px;
            margin: 10px 5px;
            cursor: pointer;
            font-family: 'Creepster', cursive;
            font-size: 1.2em;
            border-radius: 5px;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
            animation: glow 2s infinite alternate;
        }
        
        button:hover {
            background: #ff0000;
            color: #000000;
            box-shadow: 0 0 20px #ff0000, inset 0 0 10px rgba(139, 0, 0, 0.5);
            transform: scale(1.1);
            animation: shake 0.5s ease-in-out;
        }
        
        .feedback-list {
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #ff0000;
            border-radius: 10px;
            padding: 20px;
            margin: 30px auto;
            max-width: 800px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5), inset 0 0 10px rgba(139, 0, 0, 0.3);
            animation: pulse 3s infinite;
            color: #ffffff;
            text-shadow: 0 0 5px #ff0000;
        }
        
        .feedback-item {
            border-bottom: 1px solid #ff0000;
            padding: 10px 0;
            margin-bottom: 10px;
        }
        
        .feedback-item:last-child {
            border-bottom: none;
        }
        
        .ghost {
            position: absolute;
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }
        
        .ghost:nth-child(1) {
            top: 10%;
            left: 10%;
        }
        
        .ghost:nth-child(2) {
            top: 20%;
            right: 10%;
            animation-delay: 2s;
        }
        
        .ghost:nth-child(3) {
            bottom: 20%;
            left: 15%;
            animation-delay: 4s;
        }
        
        .ghost:nth-child(4) {
            top: 30%;
            right: 20%;
            animation-delay: 1s;
        }
        
        .ghost:nth-child(5) {
            bottom: 30%;
            right: 15%;
            animation-delay: 3s;
        }
        
        .fog {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(255, 255, 255, 0.05) 0%, transparent 50%), radial-gradient(circle at 70% 60%, rgba(255, 255, 255, 0.03) 0%, transparent 50%);
            animation: fog-move 20s infinite linear;
            pointer-events: none;
            z-index: -1;
            opacity: 0.05;
            transition: opacity 1s ease;
        }
        
        body.dark-mode .fog {
            opacity: 0.3;
        }
        
        @keyframes fog-move {
            0% {
                transform: translateX(-100%) translateY(-50%);
            }
            100% {
                transform: translateX(100%) translateY(50%);
            }
        }
        
        .blood-drip {
            position: absolute;
            top: 0;
            width: 2px;
            height: 100px;
            background: linear-gradient(to bottom, #ff0000 0%, rgba(255, 0, 0, 0) 100%);
            animation: drip 3s infinite linear;
            opacity: 0.6;
        }
        
        .blood-drip:nth-child(6) {
            left: 10%;
            animation-delay: 0s;
        }
        
        .blood-drip:nth-child(7) {
            right: 10%;
            animation-delay: 1s;
        }
        
        .blood-drip:nth-child(8) {
            left: 25%;
            animation-delay: 2s;
        }
        
        @keyframes drip {
            0% {
                transform: translateY(-100px);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(100vh);
                opacity: 0;
            }
        }
        
        .skull {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 60px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50% 50% 40% 40%;
            animation: skull-float 7s infinite ease-in-out;
            opacity: 0.3;
        }
        
        .skull::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 15px;
            width: 50px;
            height: 30px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 50%;
            clip-path: polygon(0% 0%, 100% 0%, 85% 100%, 15% 100%);
        }
        
        @keyframes skull-float {
            0%,
            100% {
                transform: translateX(-50%) translateY(0px) rotate(0deg);
            }
            25% {
                transform: translateX(-50%) translateY(-10px) rotate(2deg);
            }
            50% {
                transform: translateX(-50%) translateY(0px) rotate(0deg);
            }
            75% {
                transform: translateX(-50%) translateY(10px) rotate(-2deg);
            }
        }
        
        @keyframes heartbeat {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.02);
            }
        }
        
        @keyframes flicker {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.8;
            }
        }
        
        @keyframes blood-drip {
            0%,
            100% {
                text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 30px #ff0000, 0 0 40px #ff0000;
            }
            25% {
                text-shadow: 2px 2px 5px #8b0000, 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 30px #ff0000;
            }
            50% {
                text-shadow: -2px 2px 5px #8b0000, 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 30px #ff0000;
            }
            75% {
                text-shadow: 0 -2px 5px #8b0000, 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 30px #ff0000;
            }
        }
        
        @keyframes glow {
            0%,
            100% {
                box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
            }
            50% {
                box-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
            }
        }
        
        @keyframes glow-text {
            0%,
            100% {
                text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 30px #ff0000;
            }
            50% {
                text-shadow: 0 0 15px #ff4500, 0 0 25px #ff4500, 0 0 35px #ff4500;
            }
        }
        
        @keyframes shadow-shift {
            0% {
                transform: translateX(0) translateY(0);
            }
            25% {
                transform: translateX(10px) translateY(-5px);
            }
            50% {
                transform: translateX(0) translateY(0);
            }
            75% {
                transform: translateX(-10px) translateY(5px);
            }
            100% {
                transform: translateX(0) translateY(0);
            }
        }
        
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            10%,
            30%,
            50%,
            70%,
            90% {
                transform: translateX(-5px);
            }
            20%,
            40%,
            60%,
            80% {
                transform: translateX(5px);
            }
        }
        
        @keyframes float {
            0%,
            100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }
        
        @keyframes pulse {
            0%,
            100% {
                box-shadow: 0 0 20px rgba(255, 0, 0, 0.5), inset 0 0 10px rgba(139, 0, 0, 0.3);
            }
            50% {
                box-shadow: 0 0 30px rgba(255, 0, 0, 0.8), inset 0 0 15px rgba(139, 0, 0, 0.5);
            }
        }
    </style>
</head>

<body>
    <div class="background-image"></div>
    <h1>Share Your Thoughts from the Haunted Realm</h1>
    <div class="feedback-form">
        <h2>Rate Your Experience</h2>
        <div class="rating">
            <span class="star" data-rating="1">★</span>
            <span class="star" data-rating="2">★</span>
            <span class="star" data-rating="3">★</span>
            <span class="star" data-rating="4">★</span>
            <span class="star" data-rating="5">★</span>
        </div>
        <textarea id="feedbackText" placeholder="Tell us about your experience in the haunted realm..." rows="5"></textarea>
        <button id="submitFeedback">Submit Feedback</button>
    </div>
    <div class="feedback-list">
        <h2>Past Feedbacks</h2>
        <div id="feedbackContainer">
            <!-- Feedbacks will be loaded here -->
        </div>
    </div>
    <div class="ghost"></div>
    <div class="ghost"></div>
    <div class="ghost"></div>
    <div class="ghost"></div>
    <div class="ghost"></div>
    <div class="fog"></div>
    <div class="blood-drip"></div>
    <div class="blood-drip"></div>
    <div class="blood-drip"></div>
    <div class="skull"></div>
    <script>
        let selectedRating = 0;

        // Star rating functionality
        document.querySelectorAll('.star').forEach(star => {
            star.addEventListener('click', function() {
                selectedRating = parseInt(this.getAttribute('data-rating'));
                document.querySelectorAll('.star').forEach(s => s.classList.remove('active'));
                for (let i = 1; i <= selectedRating; i++) {
                    document.querySelector(`.star[data-rating="${i}"]`).classList.add('active');
                }
            });
        });

        // Submit feedback
        document.getElementById('submitFeedback').addEventListener('click', async function() {
            const feedbackText = document.getElementById('feedbackText').value;
            if (!feedbackText.trim()) {
                alert("Please enter your feedback before submitting.");
                return;
            }
            if (selectedRating === 0) {
                alert("Please select a rating.");
                return;
            }

            const response = await fetch('/submit_feedback', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    rating: selectedRating,
                    feedback: feedbackText
                })
            });

            const data = await response.json();
            if (data.ok) {
                alert("Thank you for your feedback! The spirits have heard you.");
                document.getElementById('feedbackText').value = '';
                selectedRating = 0;
                document.querySelectorAll('.star').forEach(s => s.classList.remove('active'));
                loadFeedbacks();
            } else {
                alert("Error submitting feedback. The darkness resists.");
            }
        });

        // Load past feedbacks
        async function loadFeedbacks() {
            const response = await fetch('/get_feedbacks');
            const data = await response.json();
            if (data.ok) {
                const container = document.getElementById('feedbackContainer');
                container.innerHTML = '';
                data.feedbacks.forEach(fb => {
                    const item = document.createElement('div');
                    item.className = 'feedback-item';
                    item.innerHTML = `
                        <strong>Rating: ${'★'.repeat(fb.rating)}${'☆'.repeat(5 - fb.rating)}</strong><br>
                        <p>${fb.feedback}</p>
                        <small>${new Date(fb.timestamp).toLocaleString()}</small>
                    `;
                    container.appendChild(item);
                });
            }
        }

        // Load feedbacks on page load
        loadFeedbacks();
    </script>
</body>

</html>
